description: Profile for getting start to create anything you like
skeleton:
    excludes:
        - app/i18n/*.properties
        - app/conf/spring/**
build:
    plugins:
        - war
        - org.graceframework.grace-app
    excludes:
        - org.graceframework.grace-core
dependencies:
    - scope: console
      coords: "org.graceframework:grace-console"
    - scope: compile
      coords: "org.graceframework:grace-boot"
    - scope: compile
      coords: "org.graceframework:grace-boot-plugin"
    - scope: compile
      coords: "org.springframework.boot:spring-boot-starter-web"
